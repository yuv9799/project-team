services:
  - type: web
    name: campus-connect-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 10080
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://*.vercel.app

databases:
  - name: campus-connect-db
    plan: free
    region: oregon
    databaseName: campus_connect
    user: campus
